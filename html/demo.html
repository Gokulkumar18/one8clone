<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ONE8 Clone</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">


    <!-- Montserrat Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="../css/demo.css">

</head>


<body>


<section class="hero-section">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">


        <!-- =========================
             PART 1 - MENU
        ========================== -->

        <div class="desktop-menu">

            <a href="#">
                Featured
            </a>

            <a href="#">
                Women
            </a>

            <a href="#">
                Men
            </a>

            <a href="#">
                Kids
            </a>

        </div>


        <!-- =========================
             HAMBURGER
        ========================== -->

        <button class="hamburger"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu">

            <i class="bi bi-list"></i>

        </button>


        <!-- =========================
             PART 2 - LOGO
        ========================== -->

        <div class="logo">

            <a href="#">

                <img src="../images/logo.png"
                     alt="ONE8 Logo">

            </a>

        </div>


        <!-- =========================
             PART 3 - SEARCH
        ========================== -->

        <div class="search-box">

            <input type="text"
                   placeholder="Search">

            <button type="button">

                <i class="bi bi-search"></i>

            </button>

        </div>


        <!-- =========================
             PART 4 - ICONS
        ========================== -->

        <div class="header-icons">


            <!-- Heart -->

            <a href="#"
               class="heart">

                <i class="bi bi-heart"></i>

            </a>


            <!-- User -->

            <a href="#">

                <i class="bi bi-person"></i>

            </a>


            <!-- Cart -->

            <a href="#">

                <i class="bi bi-bag"></i>

            </a>


        </div>


    </header>



    <!-- =========================
         MOBILE OFFCANVAS
    ========================== -->

    <div class="offcanvas offcanvas-start"
         tabindex="-1"
         id="mobileMenu">


        <div class="offcanvas-header">

            <h5 class="offcanvas-title">
                ONE8
            </h5>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas">
            </button>

        </div>


        <div class="offcanvas-body">

            <a href="#">
                Featured
            </a>

            <a href="#">
                Women
            </a>

            <a href="#">
                Men
            </a>

            <a href="#">
                Kids
            </a>

        </div>

    </div>



    <!-- =========================
         CAROUSEL
    ========================== -->

    <div id="one8Carousel"
         class="carousel slide carousel-fade"
         data-bs-ride="carousel"
         data-bs-interval="5000">


        <!-- =========================
             INDICATORS
        ========================== -->

        <div class="carousel-indicators">

            <button type="button"
                    data-bs-target="#one8Carousel"
                    data-bs-slide-to="0"
                    class="active">
            </button>

            <button type="button"
                    data-bs-target="#one8Carousel"
                    data-bs-slide-to="1">
            </button>

            <button type="button"
                    data-bs-target="#one8Carousel"
                    data-bs-slide-to="2">
            </button>

        </div>



        <!-- =========================
             CAROUSEL INNER
        ========================== -->

        <div class="carousel-inner">


            <!-- =========================
                 SLIDE 1
            ========================== -->

            <div class="carousel-item active">


                <img src="../images/6.jpg"
                     class="d-block w-100"
                     alt="ONE8 Collection">


                <!-- LEFT BOTTOM CONTENT -->

                <div class="carousel-details">

                    <h1>
                        ONE8
                    </h1>

                    <h2>
                        PERFORMANCE FOOTWEAR
                    </h2>

                    <p>
                        Step into your power.
                    </p>

                    <a href="#"
                       class="shop-btn">

                        SHOP NOW

                    </a>

                </div>


            </div>



            <!-- =========================
                 SLIDE 2
            ========================== -->

            <div class="carousel-item">


                <img src="../images/6.jpg"
                     class="d-block w-100"
                     alt="ONE8 Shoes">


                <!-- LEFT BOTTOM CONTENT -->

                <div class="carousel-details">

                    <h1>
                        NEW COLLECTION
                    </h1>

                    <h2>
                        BUILT FOR PERFORMANCE
                    </h2>

                    <p>
                        Discover the latest ONE8 styles.
                    </p>

                    <a href="#"
                       class="shop-btn">

                        EXPLORE NOW

                    </a>

                </div>


            </div>



            <!-- =========================
                 SLIDE 3
            ========================== -->

            <div class="carousel-item">


                <video class="d-block w-100 carousel-video"
                       autoplay
                       muted
                       loop
                       playsinline>

                    <source src="../videos/banner.mp4"
                            type="video/mp4">

                </video>


                <!-- LEFT BOTTOM CONTENT -->

                <div class="carousel-details">

                    <h1>
                        ONE8
                    </h1>

                    <h2>
                        MOVE DIFFERENT
                    </h2>

                    <p>
                        Performance meets style.
                    </p>

                    <a href="#"
                       class="shop-btn">

                        SHOP NOW

                    </a>

                </div>


            </div>


        </div>



        <!-- =========================
             PREVIOUS BUTTON
        ========================== -->

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#one8Carousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon">
            </span>

        </button>



        <!-- =========================
             NEXT BUTTON
        ========================== -->

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#one8Carousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon">
            </span>

        </button>


    </div>


</section>



<!-- =========================
     BOOTSTRAP JAVASCRIPT
========================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
